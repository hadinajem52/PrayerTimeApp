// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.0'
        kotlin_version = '2.0.0'

        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
        classpath('com.android.tools.build:gradle:8.11.0')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// ─── Local debug builds: narrow the ABI set ──────────────────────────────────
// The per-ABI `configureCMakeDebug[<abi>]` tasks that the new architecture adds
// to :app, :expo-modules-core, :react-native-gesture-handler and
// :react-native-screens account for ~90% of a no-op debug build (33s of 36s),
// and they scale linearly with the number of ABIs.
//
// Debug builds only need the ABI of the device or emulator you actually run on,
// so they default to arm64-v8a (physical devices) + x86_64 (emulators). Release
// and bundle tasks are explicitly excluded and still produce all four, so what
// ships is unchanged. Override with:
//     ./gradlew assembleDebug -PdebugArchitectures=arm64-v8a
def requestedTasks = gradle.startParameter.taskNames.join(" ").toLowerCase()
def buildsForRelease = requestedTasks.contains("release") || requestedTasks.contains("bundle")

if (!requestedTasks.isEmpty() && !buildsForRelease) {
    def shippedAbis = findProperty("reactNativeArchitectures")
    def debugAbis = (findProperty("debugArchitectures") ?: "arm64-v8a,x86_64").toString()
    allprojects {
        project.ext.set("reactNativeArchitectures", debugAbis)
    }
    logger.lifecycle("Debug build: limiting ABIs to ${debugAbis} " +
                     "(release/bundle still builds all of ${shippedAbis})")
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "$rootDir/../node_modules/@notifee/react-native/android/libs"
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
        maven { url 'https://www.jitpack.io' }
    }
}
