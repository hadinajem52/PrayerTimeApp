apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.hnjm123.ShiaPrayerLeb'
    defaultConfig {
        applicationId 'com.hnjm123.ShiaPrayerLeb'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion 
    versionCode 76
    versionName "3.5.4"
    }
    signingConfigs {
        debug {
            storeFile file("@hhhhjjj__ShiaPrayerLeb.jks")
            storePassword "***REMOVED-STOREPASS***"
            keyAlias "***REMOVED-KEYALIAS***"
            keyPassword "***REMOVED-KEYPASS***"
        }
        release {
            storeFile file("@hhhhjjj__ShiaPrayerLeb.jks")
            storePassword "***REMOVED-STOREPASS***"
            keyAlias "***REMOVED-KEYALIAS***"
            keyPassword "***REMOVED-KEYPASS***"
        }
    }
    
    lint {
        baseline = file("lint-baseline.xml")
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
        // lintVitalRelease and the generateReleaseLintModel tasks it pulls in
        // across ~28 modules were 58s of a 2m22s bundleRelease - the single
        // biggest slice. Lint produces nothing that ends up in the AAB, so
        // skipping it here yields a byte-identical artifact.
        // Run it deliberately instead: ./gradlew :app:lintRelease
        // Re-enable for a one-off check with:
        //   ./gradlew bundleRelease -Pandroid.checkReleaseLint=true
        checkReleaseBuilds (findProperty('android.checkReleaseLint')?.toBoolean() ?: false)
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // Metro writes its own res/raw/keep.xml listing the icon-font assets,
            // and it lands on the same resource path as the adhan keep.xml this
            // project generates - Metro's copy wins and the sounds lose their
            // keep rule, which is what made shrinking eat them before. The list
            // in res/values/keep_resources.xml carries the same rules from a
            // path Metro never writes to, so both survive and shrinking is safe.
            // Verify after changing: the release AAB must still contain 16
            // base/res/raw/adhan_*.ogg entries.
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    
    packagingOptions {
        jniLibs {
            // Must be false so AGP 8.5.1+ automatically aligns native libs to 16 KB page size boundaries.
            // Required by Google Play for apps targeting Android 15+ (from Nov 2025).
            useLegacyPackaging false
        }
    }
    
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
    for (i in 0..<options.size()) options[i] = options[i].trim()
    options -= ""
    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of React Native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true"
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true"
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true"

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
       
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation("androidx.work:work-runtime-ktx:2.8.1")
    implementation 'com.google.code.gson:gson:2.10.1'  // Add this line
}
